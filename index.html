<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ koi thủy mặc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+JP:wght@500;700&display=swap" />
    <style>
      :root { --paper: #ece4cf; --ink: #1d1d1d; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #f4efe3; color: var(--ink); font-family: system-ui, sans-serif; }
      main { max-width: 1280px; margin: 0 auto; padding: 16px; }
      h1 { margin: 4px 0 6px; font-size: 22px; font-weight: 600; }
      .subtitle { margin: 0 0 8px; opacity: .75; line-height: 1.5; font-size: 14px; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
      .toolbar button { padding: 6px 14px; border-radius: 8px; border: 1px solid #bbb; background: #fff; cursor: pointer; font: inherit; }
      .toolbar button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
      .toolbar .sep { width: 1px; height: 24px; background: #ccc; margin: 0 6px; }
      #scene { display: block; width: 100%; aspect-ratio: 960 / 560; height: auto; border-radius: 10px; cursor: crosshair; background: var(--paper); }
      .credit { font-size: 12px; opacity: .7; margin-top: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hồ koi thủy mặc</h1>
      <p class="subtitle">Rê chuột trên mặt nước để khuấy nước, cá giật mình. Click để thả thức ăn. Mỗi lần tải trang là một đàn koi khác, chọn ngẫu nhiên theo độ hiếm của giống.</p>
      <div class="toolbar">
        <button data-season="spring" class="on">春 Xuân</button>
        <button data-season="summer">夏 Hạ</button>
        <button data-season="autumn">秋 Thu</button>
        <button data-season="winter">冬 Đông</button>
        <span class="sep"></span>
        <button id="auto" class="on">Tự chuyển mùa</button>
      </div>
      <canvas id="scene"></canvas>
      <p class="credit" id="koiList"></p>
      <p class="credit">Cá: "Koi Fish" by 7PLUS · <a href="https://sketchfab.com/3d-models/koi-fish-236859b809984f52b70c94fd040b9c59">Sketchfab</a> · CC BY 4.0</p>
    </main>
    <script type="module" src="/src/pond.js"></script>
  </body>
</html>
