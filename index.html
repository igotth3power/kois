<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ koi thủy mặc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+JP:wght@500;700&display=swap" />
    <style>
      :root { --paper: #ece4cf; --ink: #1d1d1d; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
      /* tranh phủ kín màn hình, giữ tỉ lệ 960:560 (cắt bớt mép thừa thay vì để viền) */
      #scene { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: max(100vw, calc(100vh * 960 / 560)); aspect-ratio: 960 / 560; height: auto; display: block; cursor: crosshair; background: var(--paper); }
      /* thanh công cụ ẩn: dùng phím tắt; nút vẫn giữ trong DOM cho script */
      .toolbar { display: none; }
      /* ghi công (bắt buộc theo CC BY): gói trong nút nhỏ ở góc */
      #infoBtn { position: fixed; right: 12px; bottom: 12px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .25); background: rgba(255, 255, 255, .45); color: #333; font: 600 13px/24px Georgia, serif; text-align: center; padding: 0; cursor: pointer; opacity: .45; transition: opacity .2s; z-index: 2; }
      #infoBtn:hover, #infoBtn.on { opacity: 1; }
      #info { position: fixed; right: 12px; bottom: 46px; max-width: min(520px, calc(100vw - 24px)); padding: 10px 14px; border-radius: 8px; background: rgba(250, 246, 236, .94); box-shadow: 0 4px 18px rgba(0, 0, 0, .15); font-size: 12px; line-height: 1.6; display: none; z-index: 2; }
      #info.on { display: block; }
      #info p { margin: 0 0 4px; }
      #info .keys { opacity: .7; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button data-season="spring" class="on">春 Xuân</button>
      <button data-season="summer">夏 Hạ</button>
      <button data-season="autumn">秋 Thu</button>
      <button data-season="winter">冬 Đông</button>
      <button id="auto" class="on">Tự chuyển mùa</button>
      <button id="night">☾ Đêm</button>
    </div>
    <canvas id="scene"></canvas>
    <button id="infoBtn" title="Thông tin (I)">i</button>
    <div id="info">
      <p id="koiList"></p>
      <p>Cá: "Koi Fish" by 7PLUS · <a href="https://sketchfab.com/3d-models/koi-fish-236859b809984f52b70c94fd040b9c59">Sketchfab</a> · CC BY 4.0</p>
      <p>Ếch: "Frog" by Thunk3D scanner (Diana123456) · <a href="https://sketchfab.com/3d-models/frog-436deb1555fa42b9bc146e1b6b0d1ebc">Sketchfab</a> · CC BY 4.0 · đã giảm lưới và tô lại màu</p>
      <p class="keys">Rê chuột trên mặt nước để khuấy nước · Click để thả thức ăn · Phím 1–4: mùa · N: ngày/đêm · A: tự chuyển</p>
    </div>
    <script>
      // phím tắt thay cho thanh công cụ đã ẩn
      const click = sel => document.querySelector(sel)?.click();
      addEventListener('keydown', e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const k = e.key.toLowerCase(), seasons = { 1: 'spring', 2: 'summer', 3: 'autumn', 4: 'winter' };
        if (seasons[k]) click(`[data-season="${seasons[k]}"]`);
        else if (k === 'n') click('#night');
        else if (k === 'a') click('#auto');
        else if (k === 'i') click('#infoBtn');
      });
      document.getElementById('infoBtn').onclick = e => { const on = document.getElementById('info').classList.toggle('on'); e.currentTarget.classList.toggle('on', on); };
    </script>
    <script type="module" src="/src/pond.js"></script>
  </body>
</html>
